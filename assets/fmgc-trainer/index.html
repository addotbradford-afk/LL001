<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FMGC Progress Page Trainer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050708;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:clamp(8px,2vw,24px);background:radial-gradient(ellipse at 50% 30%,#172027 0,#090d10 52%,#030405 100%)}.trainer{width:min(97vw,1280px)}
.status{height:48px;display:flex;align-items:center;gap:16px;margin:0 0 10px;padding:0 8px 0 18px;border:1px solid #9bb0bd22;border-radius:10px;background:linear-gradient(180deg,#182026dd,#10161add);box-shadow:0 10px 28px #0005;color:#d7e0e5;font-size:13px;letter-spacing:.035em}.status:before{content:"FMGC  •  TRACK MILES";font-size:11px;font-weight:700;letter-spacing:.16em;color:#84949e;margin-right:auto}.status b{display:inline-grid;place-items:center;min-width:26px;height:26px;margin-right:8px;border-radius:50%;background:#54dff31c;color:#69e6f8;border:1px solid #65e7fa55;font-size:11px}.reset{border:1px solid #ffffff20;border-radius:7px;padding:7px 11px;background:#ffffff08;color:#b8c2c7;cursor:pointer;font-weight:700;font-size:10px;letter-spacing:.08em}.reset:hover{background:#ffffff12;color:#fff}
.unit{position:relative;width:100%;aspect-ratio:1905/1330;overflow:hidden;border:1px solid #9aabb31d;border-radius:11px;background:#000;box-shadow:0 28px 80px #000d,0 0 0 1px #000}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.screen-window{position:absolute;left:7.05%;top:7.15%;width:30.18%;height:40.05%;overflow:hidden;background:#000;pointer-events:none}.screen-shot{position:absolute;left:-23.2%;top:-17.85%;width:335.6%;height:249.9%;max-width:none}.nd-window{position:absolute;left:45.55%;top:0;width:54.45%;height:76.8%;overflow:hidden;background:#000;pointer-events:none}.nd-shot{position:absolute;left:-83.65%;top:0;width:183.65%;height:130.25%;max-width:none}.scratchpad{position:absolute;left:6%;right:5%;bottom:1.8%;height:8%;font:clamp(10px,1.85vw,25px)/1.1 "Courier New",monospace;letter-spacing:.06em;color:#e8e9e6;text-shadow:0 0 4px #fff;display:flex;align-items:center}.result-field{position:absolute;left:4.7%;right:4.5%;top:58.8%;height:8.6%;display:flex;align-items:center;justify-content:space-between;background:#000;font:700 clamp(9px,1.72vw,23px)/1 "Courier New",monospace;letter-spacing:.045em;text-shadow:0 0 4px currentColor}.result-field .brg{color:#1ed71a}.result-field .to{color:#13cbe4}.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px);opacity:.035}.hdg-control{position:absolute;left:68.5%;top:81.2%;width:10.5%;height:9%;display:grid;place-items:center;border:1px solid #52616b;border-radius:9px;background:linear-gradient(#26323a,#10171c);box-shadow:inset 0 1px #697780,0 6px 12px #0007;color:#87949b;cursor:pointer;letter-spacing:.12em}.hdg-control b{display:block;color:#dbe4e8;font-size:clamp(11px,1.5vw,19px)}.hdg-control span{font-size:clamp(7px,.75vw,10px);margin-bottom:-12px}.hdg-control.ready{border-color:#60dff077;color:#68dff0}.hdg-control.ready b{color:#fff}.hdg-control.active{box-shadow:inset 0 0 0 2px #79eaff,0 0 13px #43dfff77}
.hot{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:5px;touch-action:manipulation;transition:box-shadow .12s ease,background .12s ease}.hot:focus-visible{outline:2px solid #8ee9ff;outline-offset:1px}.hot.pressed,.hot.page-active{box-shadow:inset 0 0 0 2px #89e9ffcc,0 0 8px #55dfff55;background:#7ce8ff10}.target{animation:pulse 1.15s infinite}@keyframes pulse{50%{box-shadow:inset 0 0 0 2px #65f3ff,0 0 13px 4px #42e5ff77;background:#5cecff16}}
.message{min-height:19px;text-align:center;margin:9px 0 0;color:#84939b;font-size:11px;letter-spacing:.035em}.message.ok{color:#65ef8b}.message.err{color:#ffc357}@media(max-width:720px){body{padding:5px}.trainer{width:100%}.status{height:42px;margin-bottom:5px;padding-left:10px;font-size:10px}.status:before{content:"FMGC"}.status b{min-width:22px;height:22px}.message{font-size:10px}}
/* Original Line Logic heading knob and FMA treatment */
.fma{display:grid;grid-template-columns:1fr 1fr 1.12fr 1.15fr 1fr;width:54.45%;margin:-3px 0 9px auto;border:1px solid #52606a;border-radius:5px;background:#020303;box-shadow:0 7px 20px #0008;overflow:hidden;color:#e8ebed;font:clamp(10px,1.65vw,21px)/1.04 "Courier New",monospace;text-shadow:0 0 3px currentColor}.fma>div{min-height:62px;padding:7px 8px;border-right:2px solid #98a0a5;display:flex;flex-direction:column;align-items:center}.fma>div:last-child{border:0}.fma .green{color:#18d421}.fma .cyan{color:#18cfdf}.fma .lower{margin-top:auto;font-size:.72em;white-space:nowrap}.hdg-control{left:69.2%;top:80.2%;width:8.4%;height:auto;aspect-ratio:1;display:block;border:3px solid #b98274;border-radius:50%;background:radial-gradient(circle at 43% 36%,#60778b 0 14%,#30475a 15% 55%,#172735 56% 68%,#080d12 69%);box-shadow:inset 0 0 0 5px #0d1822,0 7px 14px #000b,0 0 0 2px #382d2b;color:transparent;letter-spacing:0}.hdg-control:before{content:"";position:absolute;left:50%;top:19%;width:28%;aspect-ratio:1;transform:translateX(-50%) rotate(45deg);border-left:3px solid #0aa7b7;border-top:3px solid #0aa7b7}.hdg-control b{position:absolute;left:50%;top:108%;transform:translateX(-50%);color:#d9e3e8;font-size:clamp(9px,1.05vw,14px);letter-spacing:.13em}.hdg-control span{position:absolute;left:50%;top:127%;transform:translateX(-50%);color:#82949d;font-size:clamp(6px,.62vw,9px);letter-spacing:.12em;margin:0}.hdg-control.ready{border-color:#d49b8b;box-shadow:inset 0 0 0 5px #0d1822,0 0 16px #48dff088,0 7px 14px #000b}.hdg-control.active{transform:translateY(-3px);box-shadow:inset 0 0 0 5px #0d1822,0 0 19px #55eaffaa,0 10px 14px #000b}@media(max-width:720px){.fma>div{min-height:42px;padding:4px}.fma{margin-bottom:5px}}
/* Supplied FMA artwork is intentionally displayed without reinterpretation. */
.fma{display:block;aspect-ratio:994/159;min-height:0;padding:0;border:0;border-radius:0;background-color:#000;background-position:center;background-repeat:no-repeat;background-size:100% 100%;box-shadow:none}.fma>div{display:none}
.radial-ready{position:absolute;left:55%;top:53.5%;width:42%;height:15%;padding:1% 2%;background:#000;color:#edf0ee;font:700 clamp(8px,1.5vw,20px)/1.15 "Courier New",monospace;letter-spacing:.08em;text-align:center;text-shadow:0 0 4px currentColor}.radial-ready span{display:block;color:#13cbe4;font-size:1.08em;margin-top:4%}
</style></head>
<body><main class="trainer" aria-label="Interactive FMGC exercise"><div class="status"><span id="instruction"><b>1</b> Choose PROG or DIR</span><button class="reset" id="reset">RESET</button></div><div class="fma" id="fma" hidden><div><span class="green">SPEED</span></div><div><span class="green">ALT</span></div><div><span class="green">HDG</span><span class="cyan" id="navMode">NAV</span></div><div><span class="lower">BARO&nbsp; <span class="cyan">720</span></span></div><div><span>AP2</span><span>1 FD 2</span><span>A/THR</span></div></div><div class="unit" id="unit"><img class="base" src="assets/FMGC1.jpg" alt="Airbus-style MCDU and navigation display"><div class="screen-window" id="screenWindow" hidden><img class="screen-shot" id="screenShot" src="assets/FMGC2.jpg" alt=""><div class="result-field" id="resultField" hidden><span class="brg" id="resultBrg"></span><span class="to" id="resultTo"></span></div><div class="scratchpad" id="scratchpad"></div><div class="scan"></div></div><div class="nd-window" id="ndWindow" hidden><img class="nd-shot" id="ndShot" src="assets/RO3.jpg" alt="Updated navigation display"></div><button class="hdg-control" id="hdgButton" type="button"><span>PULL</span><b>HDG</b></button></div><p class="message" id="message" aria-live="polite">Use the photographed MCDU controls.</p></main>
<script>
(()=>{
 const unit=document.querySelector('#unit'),screenWindow=document.querySelector('#screenWindow'),screenShot=document.querySelector('#screenShot'),ndWindow=document.querySelector('#ndWindow'),ndShot=document.querySelector('#ndShot'),hdgButton=document.querySelector('#hdgButton'),fma=document.querySelector('#fma'),navMode=document.querySelector('#navMode'),scratchEl=document.querySelector('#scratchpad'),resultField=document.querySelector('#resultField'),resultBrg=document.querySelector('#resultBrg'),resultTo=document.querySelector('#resultTo'),instruction=document.querySelector('#instruction'),message=document.querySelector('#message');
 const fixes={EGGW07:['013°','54.7'],MOREZ:['021°','20.1'],VATON:['021°','37.5'],OZZOT:['022°','51.2'],BPK:['022°','58.5'],ILLOC:['025°','68.2'],ODWAD:['010°','52.5']};let page='fpln',scratch='';const radialReady=document.createElement('div');radialReady.className='radial-ready';radialReady.innerHTML='RADIAL IN<span>253°→</span>';radialReady.hidden=true;screenWindow.append(radialReady);
 const add=(label,x,y,w,h,fn)=>{const b=document.createElement('button');b.className='hot';b.type='button';b.setAttribute('aria-label',label);Object.assign(b.style,{left:x/19.05+'%',top:y/13.30+'%',width:w/19.05+'%',height:h/13.30+'%'});b.onclick=()=>{b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),180);fn()};unit.appendChild(b);return b};
 const dir=add('DIR page',102,670,87,52,openDir),prog=add('PROG page',207,670,87,52,openProg),fpln=add('F-PLN page',102,739,87,54,goFpln);const xs=[344,431,518,605,691],ys=[810,889,968,1047,1126],letters='ABCDEFGHIJKLMNOPQRSTUVWXY'.split('');letters.forEach((c,i)=>add(c,xs[i%5],ys[Math.floor(i/5)],61,57,()=>type(c)));add('Z',344,1206,61,57,()=>type('Z'));const nxs=[101,184,267],nys=[1010,1084,1157];'123456789'.split('').forEach((c,i)=>add(c,nxs[i%3],nys[Math.floor(i/3)],57,57,()=>type(c)));add('decimal point',101,1206,57,57,()=>type('.'));add('0',184,1206,57,57,()=>type('0'));add('plus or minus',267,1206,57,57,()=>type('-'));add('Clear one character',687,1204,62,58,clear);const toLsk=add('Right line select key beside TO',757,397,60,56,selectTo),odwadLsk=add('Select ODWAD direct-to waypoint',30,324,61,56,selectOdwad),insertLsk=add('Insert direct-to ODWAD',756,540,61,58,insertDirect);
 function setMessage(text,kind=''){message.textContent=text;message.className='message '+kind}
 function updateRings(){dir.classList.toggle('page-active',page.startsWith('dir')||page==='hdg');prog.classList.toggle('page-active',page==='prog'||page==='result');fpln.classList.toggle('page-active',page==='fpln');toLsk.classList.toggle('target',page==='prog'&&!!fixes[scratch]);odwadLsk.classList.toggle('target',page==='dirList');insertLsk.classList.toggle('target',page==='dirSelected');hdgButton.classList.toggle('ready',page==='dirInserted');hdgButton.classList.toggle('active',page==='hdg')}
 function setFma(mode){fma.hidden=!mode;if(mode)fma.style.backgroundImage=`url("assets/${mode==='nav'?'FMA-NAV':'FMA-HDG'}.png")`}
 function openProg(){page='prog';scratch='';setFma('hdg');radialReady.hidden=true;screenWindow.hidden=false;ndWindow.hidden=true;screenShot.src='assets/FMGC2.jpg';resultField.hidden=true;scratchEl.textContent='';instruction.innerHTML='<b>2</b> Type a waypoint';setMessage('Enter EGGW07, MOREZ, VATON, OZZOT, BPK, ILLOC or ODWAD.');updateRings()}
 function goFpln(){page='fpln';scratch='';setFma('hdg');radialReady.hidden=true;screenWindow.hidden=true;ndWindow.hidden=true;resultField.hidden=true;scratchEl.textContent='';instruction.innerHTML='<b>1</b> Choose PROG or DIR';setMessage('Flight plan page.');updateRings()}
 function setReference(name,showNd=true){screenWindow.hidden=false;screenShot.src='assets/'+name+'.jpg';radialReady.hidden=true;resultField.hidden=true;scratchEl.textContent='';if(showNd){ndWindow.hidden=false;ndShot.src='assets/'+name+'.jpg'}}
 function openDir(){page='dirList';scratch='';setFma('hdg');setReference('RO2',false);instruction.innerHTML='<b>DIR 1</b> Select ODWAD';setMessage('Use the left line-select key beside ODWAD.');updateRings()}
 function selectOdwad(){if(page!=='dirList')return;page='dirSelected';setReference('RO3');radialReady.hidden=false;ndShot.src='assets/RO4.jpg';instruction.innerHTML='<b>DIR 2</b> Select DIR TO INSERT*';setMessage('RADIAL IN 253° is already loaded. Use the bottom-right INSERT line key.');updateRings()}
 function insertDirect(){if(page!=='dirSelected')return;page='dirInserted';setReference('RO5');setFma('nav');instruction.innerHTML='<b>DIR 3</b> Pull HDG when ready';setMessage('Direct to ODWAD with RADIAL IN 253° is active — NAV is blue.','ok');updateRings()}
 function pullHeading(){if(page!=='dirInserted'&&page!=='hdg')return;page='hdg';setFma('hdg');ndWindow.hidden=false;ndShot.src='assets/RO6.jpg';instruction.innerHTML='<b>✓</b> HDG selected';setMessage('Heading selected — NAV clears from the FMA and the ND line updates.','ok');updateRings()}
 function type(c){if(page!=='prog'||scratch.length>=10)return;scratch+=c;scratchEl.textContent=scratch;instruction.innerHTML=fixes[scratch]?'<b>3</b> Select TO with the right line key':'<b>2</b> Type a waypoint';setMessage(fixes[scratch]?'Entry ready — select the line key beside TO.':'SCRATCHPAD  ·  '+scratch);updateRings()}
 function clear(){if(page!=='prog'||!scratch)return;scratch=scratch.slice(0,-1);scratchEl.textContent=scratch;instruction.innerHTML=fixes[scratch]?'<b>3</b> Select TO with the right line key':'<b>2</b> Type a waypoint';setMessage(scratch?'SCRATCHPAD  ·  '+scratch:'Scratchpad cleared.');updateRings()}
 function selectTo(){if(page!=='prog')return;const value=fixes[scratch];if(!value){setMessage(scratch?'Waypoint not recognised. Check the entry.':'Type a waypoint first.','err');return}const fix=scratch;page='result';screenShot.src='assets/FMGC2.jpg';scratch='';scratchEl.textContent='';resultBrg.textContent=value[0]+' / '+value[1];resultTo.textContent='TO '+fix;resultField.hidden=false;instruction.innerHTML='<b>✓</b> '+value[0]+' / '+value[1]+' NM';setMessage(fix+'  ·  TRACK MILES DISPLAYED','ok');updateRings()}
 function reset(){goFpln();setMessage('Use the photographed MCDU controls.')}
 hdgButton.onclick=pullHeading;document.querySelector('#reset').onclick=reset;addEventListener('keydown',e=>{if(/^[a-z0-9.]$/i.test(e.key))type(e.key.toUpperCase());else if(e.key==='Backspace'||e.key==='Delete')clear();else if(e.key==='Enter')selectTo()});setFma('hdg');updateRings();
})();
</script></body></html>
