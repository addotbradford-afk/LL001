<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCAS Threat Sequence</title>
  <style>
    :root {
      color-scheme: light;
      --white: #152638;
      --amber: #f0a72f;
      --red: #ed3d3d;
      --muted: #66727b;
      --panel: #ffffff;
      --edge: #343a3c;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--panel);
      color: var(--white);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .tcas {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 5vw, 1.75rem);
      overflow: hidden;
    }

    .display {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 0.85rem;
      width: min(100%, 25rem);
      min-height: 12rem;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(1rem, 6vw, 2rem);
      color: var(--white);
      transition: color 180ms ease;
    }

    .symbol-box {
      width: clamp(4.5rem, 22vw, 6rem);
      height: clamp(4.5rem, 22vw, 6rem);
      display: grid;
      place-items: center;
    }

    .symbol {
      width: clamp(2rem, 10vw, 2.75rem);
      aspect-ratio: 1;
      background: currentColor;
      transition: width 180ms ease, border-radius 180ms ease, transform 180ms ease, background 180ms ease;
    }

    .symbol.open-diamond {
      width: clamp(1.9rem, 9vw, 2.5rem);
      border: clamp(0.25rem, 1.2vw, 0.34rem) solid currentColor;
      background: transparent;
      transform: rotate(45deg);
    }

    .symbol.solid-diamond { transform: rotate(45deg); }
    .symbol.ta { border-radius: 50%; }
    .symbol.ra { border-radius: 0; }

    .altitude {
      min-width: 4.2ch;
      font-size: clamp(1.55rem, 8vw, 2.25rem);
      font-weight: 750;
      line-height: 1;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .caption {
      min-height: 1.2em;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.68rem, 2.8vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .progress {
      display: flex;
      gap: 0.45rem;
      margin-top: 0.2rem;
    }

    .progress span {
      width: 0.42rem;
      height: 0.42rem;
      border: 1px solid #596164;
      border-radius: 50%;
      background: transparent;
    }

    .progress span.active { background: currentColor; border-color: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .contact, .symbol { transition: none; }
    }
  </style>
</head>
<body>
  <main class="tcas" aria-label="TCAS threat sequence animation">
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="contact" id="contact">
        <div class="symbol-box" aria-hidden="true">
          <div class="symbol open-diamond" id="symbol"></div>
        </div>
        <div class="altitude" id="altitude">+12↓</div>
      </div>
      <p class="caption" id="caption">Other traffic</p>
      <div class="progress" id="progress" aria-hidden="true">
        <span class="active"></span><span></span><span></span><span></span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const stages = [
        { shape: "open-diamond", altitude: "+12↓", label: "Other traffic", color: "var(--white)" },
        { shape: "solid-diamond", altitude: "+08↓", label: "Proximate traffic", color: "var(--white)" },
        { shape: "ta", altitude: "+04↓", label: "Traffic advisory", color: "var(--amber)" },
        { shape: "ra", altitude: "+01↓", label: "Resolution advisory", color: "var(--red)" }
      ];
      const intervalMs = 1800;
      const contact = document.getElementById("contact");
      const symbol = document.getElementById("symbol");
      const altitude = document.getElementById("altitude");
      const caption = document.getElementById("caption");
      const dots = [...document.querySelectorAll("#progress span")];
      let index = 0;
      let timer;

      function render() {
        const stage = stages[index];
        symbol.className = `symbol ${stage.shape}`;
        altitude.textContent = stage.altitude;
        caption.textContent = stage.label;
        contact.style.color = stage.color;
        dots.forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === index));
      }

      function schedule() {
        window.clearTimeout(timer);
        timer = window.setTimeout(() => {
          index = (index + 1) % stages.length;
          render();
          schedule();
        }, intervalMs);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) window.clearTimeout(timer);
        else schedule();
      });

      render();
      schedule();
    })();
  </script>
</body>
</html>
